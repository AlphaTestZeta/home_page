<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pong</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
    height: 100%;
    touch-action: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    background: #000;
  }
</style>
</head>
<body>
<canvas id="game" width="800" height="500"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const W = canvas.width;
const H = canvas.height;

// Scala il canvas (via CSS) per riempire lo schermo mantenendo l'aspect ratio originale,
// così il campo di gioco è sempre interamente visibile ("letterbox") su qualsiasi schermo.
function resizeCanvas() {
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', resizeCanvas);
resizeCanvas();

const PADDLE_W = 12;
const PADDLE_H = 90;
const PADDLE_SPEED = 6;
const BALL_SIZE = 12;
const BALL_SPEED = 3.8; // leggermente più lenta

const BASE_BOT_SPEED = 3.6;   // velocità base dell'asta del bot (leggermente sotto quella base della palla)
const BOT_DELAY_FRAMES = 14; // "delay" nella reazione del bot
const SPEEDUP_EVERY = 2;   // ogni quanti rimbalzi sulle aste la palla accelera
const SPEEDUP_FACTOR = 1.1; // moltiplicatore di velocità ad ogni accelerazione
const DEFLECT_CHANCE = 0.1; // probabilità di deviazione casuale ad ogni rimbalzo su asta
const DEFLECT_ANGLE = 20 * Math.PI / 180; // ampiezza della deviazione casuale
const MAX_BALL_ANGLE = 35 * Math.PI / 180; // tetto massimo all'angolo rispetto all'orizzontale (anti-stallo)

const BOT_ERROR_START_LEVEL = 3; // il bot resta "perfetto" per i primi N incrementi di velocità
const BOT_ERROR_PER_LEVEL = 10;  // di quanto cresce l'errore di mira (px) ad ogni incremento oltre la soglia
const BOT_ERROR_MAX = 70;        // errore di mira massimo (px)

let paddleBounceCount = 0;
let speedupLevel = 0;
let botAimError = 0;

let leftScore = 0;
let rightScore = 0;

const leftPaddle = { x: 30, y: H/2 - PADDLE_H/2 };
const rightPaddle = { x: W - 30 - PADDLE_W, y: H/2 - PADDLE_H/2 };

// Prevede la coordinata Y in cui la palla arriverà all'altezza dell'asta destra,
// simulando i rimbalzi sui bordi superiore/inferiore. Così il bot può puntare a
// centrare la palla sull'asta invece di rincorrerla all'ultimo istante.
function predictImpactY() {
  if (ball.dx <= 0) return null; // la palla si allontana, nessuna previsione utile
  let x = ball.x;
  let y = ball.y;
  let vy = ball.dy;
  const targetX = rightPaddle.x;
  let steps = 0;
  while (x < targetX && steps < 2000) {
    x += ball.dx;
    y += vy;
    if (y <= 0) { y = -y; vy = -vy; }
    else if (y + BALL_SIZE >= H) { y = 2 * (H - BALL_SIZE) - y; vy = -vy; }
    steps++;
  }
  return y + BALL_SIZE / 2;
}

let ball = resetBall();
let paused = false; // true durante la pausa dopo un punto
let started = false; // diventa true dopo la prima interazione dell'utente

// Il bot memorizza la posizione della palla con un piccolo ritardo
let botTargetHistory = [];

function resetBall() {
  const angle = (Math.random() * 0.6 - 0.3);
  const dir = Math.random() < 0.5 ? -1 : 1;
  return {
    x: W/2 - BALL_SIZE/2,
    y: H/2 - BALL_SIZE/2,
    dx: dir * BALL_SPEED * Math.cos(angle),
    dy: BALL_SPEED * Math.sin(angle)
  };
}

// Se l'angolo della palla rispetto all'orizzontale supera MAX_BALL_ANGLE, lo riporta
// dentro il limite mantenendo la stessa velocità totale (magnitudine invariata,
// cambia solo la direzione).
function clampBallAngle() {
  const speed = Math.sqrt(ball.dx * ball.dx + ball.dy * ball.dy);
  const maxDy = Math.abs(ball.dx) * Math.tan(MAX_BALL_ANGLE);
  if (Math.abs(ball.dy) > maxDy) {
    const signDy = ball.dy < 0 ? -1 : 1;
    const signDx = ball.dx < 0 ? -1 : 1;
    ball.dy = signDy * maxDy;
    ball.dx = signDx * Math.sqrt(Math.max(0, speed * speed - ball.dy * ball.dy));
  }
}

// --- Audio (Web Audio API, generato al volo, nessun file esterno) ---
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}
function playTone(freq, duration) {
  if (!audioCtx) return;
  // Se il contesto non è ancora "running" (es. resume() in corso), aspettiamo che lo sia
  // prima di programmare il suono: altrimenti l'orologio interno del contesto può essere
  // ancora fermo e il suono risulta muto o tagliato.
  if (audioCtx.state !== 'running') {
    audioCtx.resume().then(() => playTone(freq, duration));
    return;
  }
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'square';
  osc.frequency.value = freq;
  const now = audioCtx.currentTime;
  gain.gain.setValueAtTime(0.15, now);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
  osc.stop(now + duration);
}
function playBounce() {
  playTone(440, 0.08); // tono per rimbalzo (bordo o asta)
}
function playScore() {
  playTone(180, 0.25); // tono più grave per il punto
}

// --- Input tastiera (giocatore sinistro con W/S, utile su desktop) ---
const keys = {};
document.addEventListener('keydown', e => keys[e.key] = true);
document.addEventListener('keyup', e => keys[e.key] = false);

// --- Input touch: trascina ovunque sullo schermo per muovere la barra su/giù ---
let lastTouchY = null;
let touchDeltaY = 0; // spostamento accumulato dall'ultimo frame

function handleTouchStart(e) {
  ensureAudio();
  if (e.touches.length === 0) return;
  lastTouchY = e.touches[0].clientY;
}

function handleTouchMove(e) {
  if (e.touches.length === 0 || lastTouchY === null) return;
  const touchY = e.touches[0].clientY;
  const rect = canvas.getBoundingClientRect();
  // Scala lo spostamento in base al rapporto tra dimensione reale e dimensione canvas interna
  const scale = H / rect.height;
  touchDeltaY += (touchY - lastTouchY) * scale;
  lastTouchY = touchY;
}

function handleTouchEnd() {
  lastTouchY = null;
}

canvas.addEventListener('touchstart', handleTouchStart, { passive: true });
canvas.addEventListener('touchmove', handleTouchMove, { passive: true });
canvas.addEventListener('touchend', handleTouchEnd, { passive: true });
canvas.addEventListener('touchcancel', handleTouchEnd, { passive: true });

// Sblocco audio: gestito dalla schermata di avvio (vedi startGame)

function update() {
  if (!started || paused) return;

  // Paddle sinistra: tastiera + touch
  if (keys['w'] || keys['W']) leftPaddle.y -= PADDLE_SPEED;
  if (keys['s'] || keys['S']) leftPaddle.y += PADDLE_SPEED;
  if (touchDeltaY !== 0) {
    leftPaddle.y += touchDeltaY;
    touchDeltaY = 0;
  }

  leftPaddle.y = Math.max(0, Math.min(H - PADDLE_H, leftPaddle.y));

  // Bot destro: quando la palla si avvicina, prevede il punto d'impatto (con rimbalzi
  // sui bordi) e punta a centrare l'asta lì, con un delay di reazione e un errore di
  // mira che cresce solo quando la velocità è aumentata parecchio. Quando la palla si
  // allontana, l'asta resta ferma dov'è (nessun ricentramento innaturale).
  const predicted = predictImpactY();
  // La velocità dell'asta del bot scala insieme a quella della palla (stesso fattore,
  // stesso numero di incrementi), così il rapporto tra le due resta costante: il bot
  // non diventa "relativamente" più lento con l'aumentare della velocità di gioco.
  const currentBotSpeed = BASE_BOT_SPEED * Math.pow(SPEEDUP_FACTOR, speedupLevel);
  if (predicted !== null) {
    botTargetHistory.push(predicted);
    if (botTargetHistory.length > BOT_DELAY_FRAMES) {
      const target = botTargetHistory.shift() + botAimError;
      const paddleCenter = rightPaddle.y + PADDLE_H / 2;
      if (target < paddleCenter - 4) {
        rightPaddle.y -= currentBotSpeed;
      } else if (target > paddleCenter + 4) {
        rightPaddle.y += currentBotSpeed;
      }
    }
  } else {
    botTargetHistory = [];
  }
  rightPaddle.y = Math.max(0, Math.min(H - PADDLE_H, rightPaddle.y));

  ball.x += ball.dx;
  ball.y += ball.dy;

  // Rimbalzo sopra/sotto
  if (ball.y <= 0 || ball.y + BALL_SIZE >= H) {
    ball.dy *= -1;
    playBounce();
  }

  // Collisione paddle sinistra
  if (ball.x <= leftPaddle.x + PADDLE_W &&
      ball.x >= leftPaddle.x &&
      ball.y + BALL_SIZE >= leftPaddle.y &&
      ball.y <= leftPaddle.y + PADDLE_H) {
    ball.dx = Math.abs(ball.dx);
    ball.x = leftPaddle.x + PADDLE_W;
    playBounce();
    registerPaddleBounce();
  }

  // Collisione paddle destra
  if (ball.x + BALL_SIZE >= rightPaddle.x &&
      ball.x + BALL_SIZE <= rightPaddle.x + PADDLE_W &&
      ball.y + BALL_SIZE >= rightPaddle.y &&
      ball.y <= rightPaddle.y + PADDLE_H) {
    ball.dx = -Math.abs(ball.dx);
    ball.x = rightPaddle.x - BALL_SIZE;
    playBounce();
    registerPaddleBounce();
  }

  // Punto
  if (ball.x < 0) {
    rightScore++;
    playScore();
    scorePause();
  } else if (ball.x > W) {
    leftScore++;
    playScore();
    scorePause();
  }
}

function scorePause() {
  paused = true;
  // Ferma la palla al centro subito, ma la mostra di nuovo dopo 1 secondo
  ball.x = -9999; // fuori schermo durante la pausa
  botTargetHistory = [];
  botAimError = 0;
  speedupLevel = 0;
  paddleBounceCount = 0; // reset dell'accelerazione al nuovo punto
  setTimeout(() => {
    ball = resetBall();
    paused = false;
  }, 1000);
}

function registerPaddleBounce() {
  // Deviazione casuale: evita che la palla resti "intrappolata" in una traiettoria
  // quasi orizzontale che rimbalza avanti e indietro senza mai muoversi in verticale
  if (Math.random() < DEFLECT_CHANCE) {
    const sign = Math.random() < 0.5 ? 1 : -1;
    const speed = Math.sqrt(ball.dx * ball.dx + ball.dy * ball.dy);
    const currentAngle = Math.atan2(ball.dy, ball.dx);
    const newAngle = currentAngle + sign * DEFLECT_ANGLE;
    ball.dx = speed * Math.cos(newAngle);
    ball.dy = speed * Math.sin(newAngle);
  }

  // Tetto massimo all'angolo: più deviazioni casuali che si accumulano nella stessa
  // direzione (es. sempre verso l'alto) potrebbero altrimenti rendere la traiettoria
  // quasi verticale, facendo rimbalzare la palla su e giù senza quasi avanzare
  clampBallAngle();

  paddleBounceCount++;
  if (paddleBounceCount % SPEEDUP_EVERY === 0) {
    ball.dx *= SPEEDUP_FACTOR;
    ball.dy *= SPEEDUP_FACTOR;

    speedupLevel++;
    // Il bot inizia a sbagliare solo dopo i primi incrementi, e l'errore cresce
    // di poco ad ogni incremento successivo (niente cambi bruschi a metà scambio)
    const errorRange = Math.min(
      BOT_ERROR_MAX,
      Math.max(0, speedupLevel - BOT_ERROR_START_LEVEL) * BOT_ERROR_PER_LEVEL
    );
    botAimError = errorRange === 0 ? 0 : (Math.random() * 2 - 1) * errorRange;
  }
}

function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#fff';

  // Linea centrale tratteggiata
  ctx.setLineDash([10, 10]);
  ctx.beginPath();
  ctx.moveTo(W/2, 0);
  ctx.lineTo(W/2, H);
  ctx.strokeStyle = '#fff';
  ctx.stroke();
  ctx.setLineDash([]);

  // Paddle
  ctx.fillRect(leftPaddle.x, leftPaddle.y, PADDLE_W, PADDLE_H);
  ctx.fillRect(rightPaddle.x, rightPaddle.y, PADDLE_W, PADDLE_H);

  // Palla (solo se il gioco è iniziato e non in pausa)
  if (started && !paused) {
    ctx.fillRect(ball.x, ball.y, BALL_SIZE, BALL_SIZE);
  }

  // Punteggi
  ctx.font = '40px "Press Start 2P", monospace';
  ctx.textAlign = 'center';
  ctx.fillText(leftScore, W/2 - 80, 60);
  ctx.fillText(rightScore, W/2 + 80, 60);

  // Schermata di avvio
  if (!started) {
    ctx.font = '16px "Press Start 2P", monospace';
    ctx.fillText('TOCCA O PREMI UN TASTO', W/2, H/2 + 90);
    ctx.fillText('PER INIZIARE', W/2, H/2 + 120);
  }
}

function startGame() {
  if (started) return;
  started = true;
  ensureAudio();
  playBounce(); // stesso tono del rimbalzo, come conferma che l'audio funziona
  ball = resetBall();
}

document.addEventListener('keydown', startGame, { once: true });
document.addEventListener('mousedown', startGame, { once: true });
canvas.addEventListener('touchstart', startGame, { once: true });

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
