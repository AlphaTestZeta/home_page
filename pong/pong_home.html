<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pong — Seleziona Modalità</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    color: #fff;
    height: 100%;
    font-family: 'Press Start 2P', monospace;
    /* Niente scroll in nessuna direzione */
    overflow: hidden;
  }

  /* Canvas di sfondo: la classica partita di Pong che si gioca da sola */
  #bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    opacity: 0.35;
    pointer-events: none;
  }

  /* Overlay per scurire ulteriormente lo sfondo e far risaltare il contenuto */
  .vignette {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      radial-gradient(circle at 50% 40%, rgba(0,0,0,0) 0%, rgba(0,0,0,0.55) 70%, rgba(0,0,0,0.9) 100%);
  }

  .wrap {
    position: relative;
    z-index: 2;
    /* 100dvh evita lo sforamento causato dalla barra dei browser mobili */
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 20px;
    text-align: center;
    gap: 36px;
    overflow: hidden;
  }

  header {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px; /* spazio tra PONG e il sottotitolo */
  }

  h1 {
    font-size: clamp(28px, 8vw, 64px);
    letter-spacing: 6px;
    margin: 0;
    color: #fff;
    line-height: 1.1;
  }

  .subtitle {
    font-size: clamp(8px, 2.4vw, 12px);
    color: #888;
    letter-spacing: 2px;
    margin: 0;
  }

  .menu {
    display: flex;
    flex-direction: column;
    gap: 22px;
    width: 100%;
    max-width: 560px;
  }

  /* Riquadro cliccabile in stile arcade */
  .card {
    display: block;
    text-decoration: none;
    color: #fff;
    border: 3px solid #fff;
    padding: 22px 18px;
    background: rgba(0, 0, 0, 0.6);
    position: relative;
    transition: transform 0.12s ease, background 0.18s ease, color 0.18s ease, border-color 0.18s ease;
    cursor: pointer;
  }

  .card .label {
    font-size: clamp(10px, 2.6vw, 14px);
    line-height: 1.6;
    letter-spacing: 1px;
  }

  .card .tag {
    display: block;
    font-size: clamp(7px, 1.8vw, 9px);
    color: #888;
    margin-top: 12px;
    letter-spacing: 1px;
    transition: color 0.18s ease;
  }

  /* Frecce che appaiono all'hover / focus */
  .card::before,
  .card::after {
    content: '';
    position: absolute;
    top: 50%;
    width: 14px;
    height: 3px;
    background: currentColor;
    opacity: 0;
    transform: translateY(-50%);
    transition: opacity 0.18s ease, transform 0.18s ease;
  }
  .card::before { left: -22px; }
  .card::after  { right: -22px; }

  .card:hover,
  .card:focus-visible {
    outline: none;
    transform: translateY(-2px);
  }
  .card:hover::before,
  .card:hover::after,
  .card:focus-visible::before,
  .card:focus-visible::after {
    opacity: 1;
  }
  .card:hover::before, .card:focus-visible::before { transform: translateY(-50%) translateX(4px); }
  .card:hover::after,  .card:focus-visible::after  { transform: translateY(-50%) translateX(-4px); }

  /* ------------------------------------------------------------------
     COLORI PER MODALITÀ
     ------------------------------------------------------------------ */

  /* --- v1: azzurro (CLASSIC) --- */
  .card.v1 { border-color: #7fd4ff; }
  .card.v1:hover,
  .card.v1:focus-visible {
    background: #5aa9cf;
    border-color: #5aa9cf;
    color: #002233;
  }
  .card.v1:hover .tag,
  .card.v1:focus-visible .tag { color: #003a55; }

  /* --- v2: giallo (ora usato dal 1 vs 1) --- */
  .card.v2 { border-color: #ffd166; }
  .card.v2:hover,
  .card.v2:focus-visible {
    background: #cfa63f;
    border-color: #cfa63f;
    color: #332200;
  }
  .card.v2:hover .tag,
  .card.v2:focus-visible .tag { color: #4a3500; }

  /* --- v3: arancione (ora usato da 1 vs BOT — TURBO) --- */
  .card.v3 { border-color: #ff9e7f; }
  .card.v3:hover,
  .card.v3:focus-visible {
    background: #cf7a5e;
    border-color: #cf7a5e;
    color: #330f00;
  }
  .card.v3:hover .tag,
  .card.v3:focus-visible .tag { color: #4a1a05; }

  .footer {
    position: absolute;
    bottom: 12px;
    left: 0;
    right: 0;
    z-index: 2;
    font-size: 8px;
    color: #444;
    letter-spacing: 2px;
    text-align: center;
    pointer-events: none;
  }

  @media (max-width: 420px) {
    .card { padding: 18px 12px; }
    .wrap { gap: 26px; }
    header { gap: 14px; }
    .menu { gap: 16px; }
  }
</style>
</head>
<body>

<!-- Sfondo animato: partita di Pong che si gioca da sola -->
<canvas id="bg"></canvas>
<div class="vignette"></div>

<main class="wrap">
  <header>
    <h1>PONG</h1>
    <p class="subtitle">SELECT AN OPTION</p>
  </header>

  <nav class="menu">

    <a class="card v1" href="pong_1vb.html">
      <span class="label">1 vs BOT — CLASSIC</span>
      <span class="tag"></span>
    </a>

    <!-- 1 vs BOT — TURBO: ora arancione (v3) -->
    <a class="card v3" href="pong_1vb_2.0.html">
      <span class="label">1 vs BOT — TURBO</span>
      <span class="tag"></span>
    </a>

    <!-- 1 vs 1: ora giallo (v2) -->
    <a class="card v2" href="pong_1v1.html">
      <span class="label">1 vs 1</span>
      <span class="tag"></span>
    </a>

  </nav>
</main>

<footer class="footer">© PONG</footer>

<script>
// ------------------------------------------------------------------
// Sfondo animato: partita di Pong a turni.
// Solo UNA asta per volta è "attiva" e insegue la palla. Quando la
// colpisce, si ferma e passa il turno all'altra asta, che comincia
// a inseguirla. E così via all'infinito.
// ------------------------------------------------------------------
const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');

let W = 0, H = 0;

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

const BALL_SIZE = 14;
const PADDLE_W  = 14;
const PADDLE_H  = 100;
const BALL_SPEED = 5;

// Chi sta inseguendo in questo momento: 'left' o 'right'
let activeSide = 'left';

let ball  = { x: W/2, y: H/2, dx: BALL_SPEED, dy: BALL_SPEED * 0.6 };
let left  = { x: 40,                y: H/2 - PADDLE_H/2 };
let right = { x: W - 40 - PADDLE_W, y: H/2 - PADDLE_H/2 };

function resetBgBall() {
  ball.x = W/2;
  ball.y = H/2;
  ball.dx = (Math.random() < 0.5 ? -1 : 1) * BALL_SPEED;
  ball.dy = (Math.random() * 2 - 1) * BALL_SPEED * 0.7;
  // Chi deve inseguire è chi ha la palla in arrivo
  activeSide = ball.dx < 0 ? 'left' : 'right';
}

// Muove l'asta verso la palla (solo se è il suo turno).
function followIfActive(paddle, side) {
  if (activeSide !== side) return;

  const center = paddle.y + PADDLE_H / 2;
  const target = ball.y + BALL_SIZE / 2;
  const diff = target - center;
  const speed = 6;

  if (Math.abs(diff) > 3) {
    paddle.y += Math.sign(diff) * Math.min(speed, Math.abs(diff));
  }
  paddle.y = Math.max(0, Math.min(H - PADDLE_H, paddle.y));
}

function updateBg() {
  ball.x += ball.dx;
  ball.y += ball.dy;

  // Rimbalzo sopra/sotto
  if (ball.y <= 0 || ball.y + BALL_SIZE >= H) {
    ball.dy *= -1;
    ball.y = Math.max(0, Math.min(H - BALL_SIZE, ball.y));
  }

  // Collisione asta sinistra
  if (ball.dx < 0 &&
      ball.x <= left.x + PADDLE_W &&
      ball.x >= left.x &&
      ball.y + BALL_SIZE >= left.y &&
      ball.y <= left.y + PADDLE_H) {
    ball.dx = Math.abs(ball.dx);
    ball.x = left.x + PADDLE_W;
    // L'asta sinistra ha colpito: si ferma e tocca alla destra
    activeSide = 'right';
  }

  // Collisione asta destra
  if (ball.dx > 0 &&
      ball.x + BALL_SIZE >= right.x &&
      ball.x + BALL_SIZE <= right.x + PADDLE_W &&
      ball.y + BALL_SIZE >= right.y &&
      ball.y <= right.y + PADDLE_H) {
    ball.dx = -Math.abs(ball.dx);
    ball.x = right.x - BALL_SIZE;
    // L'asta destra ha colpito: si ferma e tocca alla sinistra
    activeSide = 'left';
  }

  // Punto (fuori campo): rimette in gioco e riassegna il turno
  if (ball.x < -BALL_SIZE || ball.x > W + BALL_SIZE) {
    resetBgBall();
  }

  // Solo l'asta attiva insegue la palla; l'altra resta ferma dov'è
  followIfActive(left,  'left');
  followIfActive(right, 'right');
}

function drawBg() {
  ctx.clearRect(0, 0, W, H);

  ctx.fillStyle = '#fff';

  // Linea centrale tratteggiata
  ctx.setLineDash([12, 14]);
  ctx.beginPath();
  ctx.moveTo(W/2, 0);
  ctx.lineTo(W/2, H);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.setLineDash([]);

  // Aste
  ctx.fillRect(left.x,  left.y,  PADDLE_W, PADDLE_H);
  ctx.fillRect(right.x, right.y, PADDLE_W, PADDLE_H);

  // Palla
  ctx.fillRect(ball.x, ball.y, BALL_SIZE, BALL_SIZE);
}

function loop() {
  updateBg();
  drawBg();
  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
